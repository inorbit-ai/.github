# Reusable security scan for InOrbit repositories: Semgrep (SAST), Trivy (dependencies) and
# Gitleaks (secrets), the same scanners the inorbit/inorbit monorepo runs in GitLab CI
# (.gitlab/ci/security.gitlab-ci.yml there).
#
# Report-only: findings never fail the calling workflow; a scanner that crashes does. Each run
# writes a summary to the job page and uploads the `security-reports` artifact: one HTML report
# for all scanners (security-report.html, from Microsoft's sarif-tools) and the SARIF files.
# Code scanning alerts in the GitHub Security tab need GitHub Advanced Security, which the org
# does not have; the SARIF files are what that tab would read.
#
# Versions: the scanner images and sarif-tools are pinned. Trivy downloads its vulnerability
# database and Semgrep its rules on every run, so new advisories and rules arrive without a
# version bump; Gitleaks' rules ship in its binary. Dependabot cannot bump these (they are not
# `uses:` references): review them every quarter. The actions are pinned to commit SHAs and
# Dependabot bumps them (.github/dependabot.yml).
#
# Call it from a repository with .github/workflows/security.yml:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "0 7 * * 1"
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     scan:
#       uses: inorbit-ai/.github/.github/workflows/security-scan.yml@main
name: security-scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Run the scanner images as the runner user, so the mounted checkout is not "dubious
      # ownership" to git and the reports are not root-owned. HOME must be writable for the
      # scanners' caches.
      DOCKER_RUN: docker run --rm --user 1001:1001 -e HOME=/tmp -v ${{ github.workspace }}:/src -w /src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the history, not only the last commit.
          fetch-depth: 0

      - name: Semgrep (SAST)
        run: $DOCKER_RUN semgrep/semgrep:1.181.0 semgrep scan --config p/default --metrics=off --sarif --output semgrep.sarif

      - name: Trivy (dependencies)
        run: $DOCKER_RUN aquasec/trivy:0.76.0 fs --scanners vuln --format sarif --output trivy.sarif --exit-code 0 .

      - name: Gitleaks (secrets)
        # --redact keeps secret values out of the report and the job log.
        run: $DOCKER_RUN zricethezav/gitleaks:v8.30.1 git --redact --report-format sarif --report-path gitleaks.sarif --exit-code 0 .

      - name: Report
        run: |
          pipx run --spec sarif-tools==3.0.5 sarif html -o security-report.html semgrep.sarif trivy.sarif gitleaks.sarif
          {
            echo '## Security scan'
            echo '```'
            pipx run --spec sarif-tools==3.0.5 sarif summary semgrep.sarif trivy.sarif gitleaks.sarif
            echo '```'
            echo 'Full report: `security-report.html` in the `security-reports` artifact of this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            security-report.html
            semgrep.sarif
            trivy.sarif
            gitleaks.sarif
          if-no-files-found: warn
          retention-days: 90
